baseURL = "https://bardonscouts.org.au/"
languageCode = "en-au"
title = "Bardon Scouts"

# Enable GitInfo for last modified dates
enableGitInfo = true

# No tag or category pages: the site has no template for them, so they
# were 404s in the sitemap. News posts show their tags as text (#67)
disableKinds = ["taxonomy", "term"]

# Allow reading Netlify's COMMIT_REF (plus Hugo's defaults) so each
# build can be stamped with the commit it was built from
[security.funcs]
  getenv = ['^HUGO_', '^CI$', '^COMMIT_REF$']

# Markup settings
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow HTML in markdown

# Image processing
[imaging]
  quality = 85
  resampleFilter = "Lanczos"

# Output formats
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

# The Recipes page also has a JSON version (/recipes/index.json, from
# layouts/recipes/list.json), which the cookbook print page reads (#117).
# Set here rather than in content/recipes/_index.md so a CMS save can't drop it
[[cascade]]
  outputs = ["HTML", "JSON"]
  [cascade._target]
    path = "/recipes"
    kind = "section"

# Taxonomies
[taxonomies]
  tag = "tags"
  category = "categories"
