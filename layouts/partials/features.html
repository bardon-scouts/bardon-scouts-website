<div class="columns is-multiline is-mobile features">
  {{ range site.Data.features }}
  <div class="column is-6-mobile is-6-tablet is-3-desktop feature">
    <div class="has-text-centered">
      <img class="feature-image" src="{{ .image }}" alt="{{ .text }}">
    </div>
    <p class="has-text-centered">{{ .text }}</p>
  </div>
  {{ end }}
</div>
