<div class="columns">
  {{ range site.Data.sections }}
  <div class="column unit">
    <h2 class="is-size-1 has-text-weight-bold has-text-primary has-text-centered">
      <a href="/sections/{{ .slug }}/">{{ .name }}</a>
    </h2>
    <h3 class="has-text-centered">
      {{ .ageRange }} year olds
    </h3>
    <p class="has-text-centered lead">
      Meeting time:<br>{{ .meetingTime }} {{ .meetingDay }}s
    </p>
  </div>
  {{ end }}
</div>
