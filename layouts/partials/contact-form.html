<form name="contact" method="post" action="/contact/thanks/" data-netlify="true" data-netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="contact">

  <!-- Honeypot -->
  <div hidden>
    <label>
      Don't fill this out: <input name="bot-field">
    </label>
  </div>

  <div class="field">
    <label class="label" for="name">Your name</label>
    <div class="control">
      <input class="input" type="text" name="name" id="name" required>
    </div>
  </div>

  <div class="field">
    <label class="label" for="email">Email</label>
    <div class="control">
      <input class="input" type="email" name="email" id="email" required>
    </div>
  </div>

  <div class="field">
    <label class="label" for="child_names">Child Name(s)</label>
    <div class="control">
      <input class="input" type="text" name="child_names" id="child_names" required>
    </div>
  </div>

  <div class="field">
    <label class="label" for="message">Message</label>
    <div class="control">
      <textarea class="textarea" name="message" id="message" required></textarea>
    </div>
  </div>

  <div class="field">
    <button type="submit">Send</button>
  </div>

  <p><a href="/">&lt; Back</a></p>
</form>
