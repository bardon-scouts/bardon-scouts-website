sections:
  - name: Joey Scouts
    slug: joeys
    ageRange: "5 to 8"
    meetingDay: Tuesday
    meetingTime: "6:30 - 7:30pm"
    color: "#4CAF50"
    image: /img/joeys.jpg
    description: "Joey Scouts is the starting point for young adventurers to learn, play and grow."
    tagline: "Joey Scouts (ages 5 to 8) is where the Scouting adventure begins! Our Joey mob meets every Tuesday evening for fun, games, and learning through play."
    leader: "Joey Scout Leader"
    order: 0
    content: |
      ## What We Do

      Joey Scouts is all about learning through play and friendship. Joey Scouts participate in:

      - **Fun and Games** - Active play, indoor and outdoor games
      - **Creative Activities** - Arts, crafts, storytelling, and imaginative play
      - **Basic Skills** - Introduction to outdoor skills in a fun, age-appropriate way
      - **Making Friends** - Building friendships and learning to work as a team
      - **Community Awareness** - Learning about helping others and our community

      ## Our Program

      The Joey Scout program follows the Australian Scouts program, with activities designed specifically for 5 to 8 year olds. Joey Scouts explore, discover, and have fun in a safe and supportive environment.

      See **[Joey Scout Programs](/sections/joey-programs/)** for how we run our regular meeting programs.

      ## Join Joey Scouts

      If your child is 5 to 8 years old and ready to start their Scouting journey, Joey Scouts is where to begin.

      To arrange a visit, use [Ask to Join](/ask-to-join/). For other questions about joining Joey Scouts at Bardon, [contact us](/contact/).

  - name: Cub Scouts
    slug: cubs
    ageRange: "8 to 11"
    meetingDay: Tuesday
    meetingTime: "6:30 - 8:00pm"
    color: "#FFC107"
    image: /img/buddha-s-light-cubs-bush-walk-2.jpg
    description: "Cub Scouts is all about fun, adventure and making friends."
    tagline: "Cub Scouts (ages 8-11) is where adventure begins! Our Cub pack meets every Tuesday evening for games, activities, and planning exciting adventures."
    leader: "Cub Scout Leader (Akela)"
    order: 1
    content: |
      ## What We Do

      Cub Scouts is all about learning through fun and adventure. Cub Scouts participate in:

      - **Outdoor Adventures** - Regular camps, hikes, and outdoor activities
      - **Skill Development** - Learning practical skills like cooking, first aid, and navigation
      - **Team Challenges** - Working together to solve problems and complete challenges
      - **Community Service** - Participating in community events and helping others
      - **Creative Activities** - Arts, crafts, drama, and music

      ## Our Program

      The Cub Scout program follows the Australian Scouts program, with activities designed specifically for 8-11 year olds. Cub Scouts work towards achievement badges while having fun and making friends.

      ## Join Cub Scouts

      If your child is 8-11 years old and ready for adventure, Cub Scouts is the section to join.

      To arrange a visit, use [Ask to Join](/ask-to-join/). For other questions about joining Cub Scouts at Bardon, [contact us](/contact/).

  - name: Scouts
    slug: scouts
    ageRange: "11 to 15"
    meetingDay: Thursday
    meetingTime: "6:30 - 8:30pm"
    color: "#4CAF50"
    image: /img/buddha-s-light-cubs-bush-walk-2.jpg
    description: "Scouts is where young people challenge themselves, try new things, and go on adventures."
    tagline: "Scouts (ages 11-15) is where the real adventure begins! Our Scout Troop meets every Thursday evening for activities that challenge, inspire, and excite."
    leader: "Scout Leader"
    order: 2
    content: |
      ## What We Do

      Scouts take the lead in planning and running their own adventures. Activities include:

      - **Adventure Activities** - Camping, hiking, abseiling, canoeing, and more
      - **Leadership Development** - Taking responsibility and leading activities
      - **Outdoor Skills** - Navigation, bushcraft, survival skills, and outdoor cooking
      - **Community Engagement** - ANZAC Day services, community projects, fundraising
      - **Special Interest Activities** - From technology to sports to environmental conservation

      ## Our Program

      The Scout program is youth-led, with Scouts making decisions about their activities and adventures. Scouts work towards challenging badges and participate in regional and national events.

      ## Join Scouts

      If you're 11-15 years old and ready for adventure, challenge, and making great friends, Scouts is for you!

      To arrange a visit, use [Ask to Join](/ask-to-join/). For other questions about joining Scouts at Bardon, [contact us](/contact/).

  - name: Venturer Scouts
    slug: venturers
    ageRange: "14 to 18"
    meetingDay: Thursday
    meetingTime: "7:00 - 9:00pm"
    color: "#E91E63"
    image: /img/buddha-s-light-cubs-bush-walk-2.jpg
    description: "Venturer Scouts is for older youth seeking bigger challenges, independence, and life-changing experiences."
    tagline: "Venturer Scouts (ages 14-18) is all about big adventures, personal challenge, and preparing for life beyond school. Our Venturer Scout Unit meets every Thursday evening."
    leader: "Venturer Scout Leader"
    order: 3
    content: |
      ## What We Do

      Venturer Scouts are fully youth-led, planning and running their own program with adult support. Activities include:

      - **Major Expeditions** - Multi-day hikes, bike tours, interstate and international trips
      - **Adventure Sports** - Rock climbing, kayaking, caving, snow sports
      - **Leadership Projects** - Planning and leading activities for younger sections
      - **Community Leadership** - Service projects, advocacy, and making a difference
      - **Life Skills** - First aid, outdoor survival, project management, and more

      ## Our Program

      The Venturer Scout program is completely youth-led. Venturer Scouts decide what they want to do, plan the details, and make it happen. This develops real-world leadership, teamwork, and project management skills.

      ## Join Venturer Scouts

      If you're 14-18 years old and ready for bigger challenges, more independence, and life-changing adventures, Venturer Scouts is the place for you!

      To arrange a visit, use [Ask to Join](/ask-to-join/). For other questions about joining Venturer Scouts at Bardon, [contact us](/contact/).
