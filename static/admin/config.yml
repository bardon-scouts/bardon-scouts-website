backend:
  name: github
  repo: bardon-scouts/bardon-scouts-website
  branch: master
  commit_messages:
    create: 'Create {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'
    uploadMedia: '[skip ci] Upload "{{path}}"'
    deleteMedia: '[skip ci] Delete "{{path}}"'

local_backend: true

media_folder: static/img
public_folder: /img

# Enable editorial workflow (draft/review/publish)
publish_mode: editorial_workflow

collections:
  # Homepage
  - name: "homepage"
    label: "Homepage"
    files:
      - file: "content/_index.md"
        label: "Homepage"
        name: "homepage"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string" }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Subheading", name: "subheading", widget: "string" }
          - label: "Main Pitch"
            name: "mainPitch"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "Show Contact Button", name: "contactCTA", widget: "boolean", default: true }
          - { label: "Body", name: "body", widget: "markdown", required: false }

      - file: "content/events/_index.md"
        label: "Events Page"
        name: "events-page"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string" }
          - { label: "Type", name: "type", widget: "hidden", default: "page" }
          - { label: "Body", name: "body", widget: "markdown" }

  # News (replacing Blog)
  - name: "news"
    label: "News"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Featured Image", name: "featuredImage", widget: "image", required: false }
      - { label: "Summary", name: "summary", widget: "text" }
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        field: { label: "Tag", name: "tag", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }

  # Events (Future)
  - name: "events"
    label: "Events"
    folder: "content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "End Date", name: "endDate", widget: "datetime", required: false }
      - { label: "Location", name: "location", widget: "string" }
      - label: "Related Sections"
        name: "sections"
        widget: "select"
        multiple: true
        required: false
        options: ["joeys", "cubs", "scouts", "venturers"]
      - { label: "RSVP Required", name: "rsvp", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # Simple Pages
  - name: "pages"
    label: "Pages"
    files:
      - file: "content/about.md"
        label: "About"
        name: "about"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string" }
          - { label: "Type", name: "type", widget: "hidden", default: "page" }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "content/calendar.md"
