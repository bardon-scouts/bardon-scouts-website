  # Data Files - Features
  - name: "data_features"
    label: "Homepage Features"
    files:
      - file: "data/features.yaml"
        label: "Features"
        name: "features"
        fields:
          - label: "Features"
            name: "features"
            widget: "list"
            fields:
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Text", name: "text", widget: "text" }

  # Data Files - Scout Sections (Single Source of Truth)
  - name: "data_sections"
    label: "Scout Sections"
    files:
      - file: "data/sections.yaml"
        label: "Sections"
        name: "sections"
        fields:
          - label: "Sections"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Slug", name: "slug", widget: "string", hint: "URL-friendly name (e.g. joeys, cubs)" }
              - { label: "Age Range", name: "ageRange", widget: "string", hint: "e.g. 6 to 8" }
              - { label: "Meeting Day", name: "meetingDay", widget: "select", options: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"] }
              - { label: "Meeting Time", name: "meetingTime", widget: "string", hint: "e.g. 6:30 - 8:00pm" }
              - { label: "Color", name: "color", widget: "string", hint: "Hex color code, e.g. #FFC107" }
              - { label: "Hero Image", name: "image", widget: "image" }
              - { label: "Description", name: "description", widget: "text", hint: "Short description for cards/lists" }
              - { label: "Tagline", name: "tagline", widget: "text", hint: "Full intro paragraph shown on section page" }
              - label: "Activities"
                name: "activities"
                widget: "list"
                field: { label: "Activity", name: "activity", widget: "string" }
              - { label: "Leader Title", name: "leader", widget: "string", hint: "e.g. Cub Leader (Akela)" }
              - { label: "Display Order", name: "order", widget: "number", value_type: "int", hint: "Lower numbers appear first" }
              - { label: "Content", name: "content", widget: "markdown", hint: "Full page content with headings and details" }
